<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HostelHub Ghana</title>
  <meta name="description" content="Sign in to your HostelHub account as a student, hostel owner, or administrator." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background-color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Header -->
  <header class="auth-header">
    <div class="container auth-header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-badge">H</span>
        <span>Hostel<span style="color: var(--secondary);">Hub</span></span>
        <span class="brand-tagline">Ghana</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">← Back to Home</a>
    </div>
  </header>

  <!-- Login Main -->
  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem;">
    <div style="background-color: white; border-radius: var(--radius-xl); border: 1px solid var(--border-color); width: 100%; max-width: 480px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-primary" style="margin-bottom: 0.5rem;">HostelHub Portal</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary);">Sign In</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.35rem;">
          Access your saved hostels, room requests, or listing management.
        </p>
      </div>

      <!-- Quick Demo Login Presets for Easy Grading / Testing -->
      <div style="background-color: var(--bg-muted); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.75rem;">
        <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">
          ⚡ Quick 1-Click Demo Logins
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="demoLogin('student')" style="font-size: 0.75rem; padding: 0.4rem;">
            🎓 Student
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="demoLogin('owner')" style="font-size: 0.75rem; padding: 0.4rem;">
            🏢 Owner
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="demoLogin('admin')" style="font-size: 0.75rem; padding: 0.4rem;">
            🛡️ Admin
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="submitLogin(event)">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="e.g. student@ug.edu.gh" 
            value="student@ug.edu.gh" 
            required 
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" onclick="alert('For this demo, any password or password123 will log you in.')" style="font-size: 0.75rem; color: var(--primary);">Forgot Password?</a>
          </div>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            value="password123" 
            required 
          />
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to HostelHub 🚀
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account yet? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>

    </div>
  </main>

  <!-- Footer Info -->
  <footer style="text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border-color); background: white;">
    HostelHub Ghana • Student Accommodation Portal • Secure & Verified
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { handleLogin } from './js/auth.js';

    window.submitLogin = function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      handleLogin(email, pass);
    };

    window.demoLogin = function(role) {
      if (role === 'admin') {
        document.getElementById('login-email').value = 'admin@hostelhub.gh';
        document.getElementById('login-password').value = 'adminpassword';
        handleLogin('admin@hostelhub.gh', 'adminpassword');
      } else if (role === 'owner') {
        document.getElementById('login-email').value = 'owner@hostels.gh';
        document.getElementById('login-password').value = 'password123';
        handleLogin('owner@hostels.gh', 'password123');
      } else {
        document.getElementById('login-email').value = 'student@ug.edu.gh';
        document.getElementById('login-password').value = 'password123';
        handleLogin('student@ug.edu.gh', 'password123');
      }
    };
  </script>
</body>
</html>

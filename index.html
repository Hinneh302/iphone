const getAccountsDB = () => {
  try {
    const raw = localStorage.getItem(ACCOUNTS_DB_KEY);
    if (!raw) {
      localStorage.setItem(ACCOUNTS_DB_KEY, JSON.stringify(DEFAULT_SEED_ACCOUNTS));
      return DEFAULT_SEED_ACCOUNTS;
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) && parsed.length > 0 ? parsed : DEFAULT_SEED_ACCOUNTS;
  } catch (e) {
    return DEFAULT_SEED_ACCOUNTS;
  }
};

const saveAccountsDB = (accounts) => {
  try {
    localStorage.setItem(ACCOUNTS_DB_KEY, JSON.stringify(accounts));
  } catch (e) {
    console.error("Failed to save accounts database", e);
  }
};

const findAccountByIdentifier = (ident) => {
  if (!ident) return null;
  const accounts = getAccountsDB();
  const clean = ident.trim().toLowerCase();
  const digitsOnly = clean.replace(/[^0-9]/g, "");

  return accounts.find(acc => {
    const accEmail = (acc.email || "").trim().toLowerCase();
    const accPhone = (acc.phone || "").trim().toLowerCase();
    const accDigits = accPhone.replace(/[^0-9]/g, "");

    if (accEmail && accEmail === clean) return true;
    if (clean.includes("@") && accEmail === clean) return true;
    if (digitsOnly.length >= 7 && accDigits.length >= 7 && (accDigits.endsWith(digitsOnly) || digitsOnly.endsWith(accDigits))) return true;
    if (accPhone && accPhone === clean) return true;
    return false;
  }) || null;
};

const AuthModal = ({ isOpen, onClose, onLoginSuccess, showToast, initialTab = "signin" }) => {
  const [tab, setTab] = useState(initialTab === "signup" ? "signup" : "signin");
  const [loading, setLoading] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const [shake, setShake] = useState(false);
  
  const [formData, setFormData] = useState({
    name: "",
    email: "",
    phone: "",
    password: "",
    remember: true
  });

  const [errorState, setErrorState] = useState(null);

  useEffect(() => {
    if (isOpen) {
      setTab(initialTab === "signup" ? "signup" : "signin");
      setErrorState(null);
    }
  }, [isOpen, initialTab]);

  // Allow Escape key to dismiss/remove modal
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === "Escape" && isOpen) {
        onClose();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  const triggerShake = () => {
    setShake(true);
    setTimeout(() => setShake(false), 500);
  };

  const handleIdentifierChange = (val) => {
    setFormData(prev => ({ ...prev, email: val }));
    if (errorState) setErrorState(null);
  };

  const handlePasswordChange = (val) => {
    setFormData(prev => ({ ...prev, password: val }));
    if (errorState) setErrorState(null);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    setErrorState(null);

    const ident = formData.email.trim();
    if (!ident) {
      setErrorState({ type: "VALIDATION", message: "Please enter your email or phone number." });
      triggerShake();
      return;
    }

    if (tab === "signin") {
      const matchedAccount = findAccountByIdentifier(ident);

      if (!matchedAccount) {
        setErrorState({
          type: "NOT_FOUND",
          message: "No account found. Create an account to get started.",
          identifier: ident
        });
        triggerShake();
        return;
      }

      if (!formData.password) {
        setErrorState({ type: "VALIDATION", message: "Please enter your password." });
        triggerShake();
        return;
      }

      setLoading(true);
      setTimeout(() => {
        setLoading(false);

        if (matchedAccount.password !== formData.password) {
          setErrorState({
            type: "WRONG_PASSWORD",
            message: "Incorrect password. Please try again."
          });
          triggerShake();
          return;
        }

        // Login success
        const all = getAccountsDB();
        const updatedAccounts = all.map(a => {
          if (a.id === matchedAccount.id) {
            return {
              ...a,
              lastActive: "Just now",
              savedOnDevice: true
            };
          }
          return a;
        });
        saveAccountsDB(updatedAccounts);

        const activeSessionUser = {
          id: matchedAccount.id,
          name: matchedAccount.name,
          email: matchedAccount.email || matchedAccount.phone,
          phone: matchedAccount.phone,
          avatar: matchedAccount.avatar || matchedAccount.name[0].toUpperCase(),
          role: matchedAccount.role || "Verified Customer",
          memberSince: matchedAccount.memberSince || new Date().getFullYear()
        };

        localStorage.setItem("core_auth_user", JSON.stringify(activeSessionUser));
        onLoginSuccess(activeSessionUser);
        showToast(`Welcome back, ${matchedAccount.name}!`);
        onClose();
      }, 450);

    } else if (tab === "signup") {
      if (!formData.name.trim()) {
        setErrorState({ type: "VALIDATION", message: "Please enter your full name." });
        triggerShake();
        return;
      }
      if (!formData.password || formData.password.length < 6) {
        setErrorState({ type: "VALIDATION", message: "Password must be at least 6 characters." });
        triggerShake();
        return;
      }

      const existing = findAccountByIdentifier(ident);
      if (existing) {
        setErrorState({
          type: "ALREADY_EXISTS",
          message: "An account already exists with this contact."
        });
        triggerShake();
        return;
      }

      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        const isEmail = ident.includes("@");
        const newAccount = {
          id: "usr_" + Date.now(),
          name: formData.name.trim(),
          email: isEmail ? ident.toLowerCase() : "",
          phone: !isEmail ? ident : (formData.phone || ""),
          password: formData.password,
          avatar: formData.name.trim()[0].toUpperCase(),
          role: "Verified Customer",
          memberSince: new Date().getFullYear(),
          savedOnDevice: true,
          lastActive: "Just now"
        };

        const currentAccounts = getAccountsDB();
        saveAccountsDB([newAccount, ...currentAccounts]);

        const sessionUser = {
          id: newAccount.id,
          name: newAccount.name,
          email: newAccount.email || newAccount.phone,
          phone: newAccount.phone,
          avatar: newAccount.avatar,
          role: newAccount.role,
          memberSince: newAccount.memberSince
        };

        localStorage.setItem("core_auth_user", JSON.stringify(sessionUser));
        onLoginSuccess(sessionUser);
        showToast(`Account created! Welcome, ${newAccount.name}.`);
        onClose();
      }, 500);
    }
  };

  const handleSwitchToSignUp = (prefillIdent) => {
    setTab("signup");
    setErrorState(null);
    if (prefillIdent) {
      setFormData(prev => ({ ...prev, email: prefillIdent, password: "" }));
    }
  };

  const handleSwitchToSignIn = (prefillIdent) => {
    setTab("signin");
    setErrorState(null);
    if (prefillIdent) {
      setFormData(prev => ({ ...prev, email: prefillIdent, password: "" }));
    }
  };

  return (
    <div 
      onClick={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
      className="fixed inset-0 z-[70] flex items-center justify-center bg-ink/75 backdrop-blur-sm p-4 overflow-y-auto cursor-pointer"
      title="Click outside to close"
    >
      <div 
        onClick={(e) => e.stopPropagation()}
        className={`bg-paper border border-line w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl rise-in my-auto cursor-default ${shake ? "shake" : ""}`}
      >
        
        {/* Clean Header with Close Action */}
        <div className="flex items-center justify-between px-6 pt-5 pb-3 border-b border-line/60 bg-white">
          <div className="flex items-center gap-2.5">
            <span className="w-8 h-8 rounded-xl bg-ink text-goldlight flex items-center justify-center font-display font-bold text-sm shadow-sm">
              {BUSINESS.shortName[0]}
            </span>
            <div>
              <h3 className="font-display font-semibold text-base text-ink leading-tight">
                {tab === "signin" ? "Sign In" : "Create Account"}
              </h3>
              <p className="text-[11px] text-ink/50">
                {BUSINESS.name}
              </p>
            </div>
          </div>
          <button 
            type="button"
            onClick={onClose} 
            className="px-2.5 py-1 rounded-full bg-paper border border-line flex items-center gap-1 hover:border-ink/40 text-ink/70 hover:text-ink text-xs font-medium transition-colors"
            title="Close"
          >
            <Icon name="x" className="w-3.5 h-3.5" />
            <span>Close</span>
          </button>
        </div>

        {/* SIGN IN TAB */}
        {tab === "signin" && (
          <form onSubmit={handleSubmit} className="p-5 space-y-3.5">
            {errorState && errorState.type === "NOT_FOUND" && (
              <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-950 text-xs rise-in">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-1.5 font-medium">
                    <Icon name="alertCircle" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                    <span>No account found.</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => handleSwitchToSignUp(formData.email)}
                    className="font-bold text-gold hover:underline underline-offset-2 flex-shrink-0"
                  >
                    Create Account
                  </button>
                </div>
              </div>
            )}

            {errorState && errorState.type === "WRONG_PASSWORD" && (
              <div className="p-3 rounded-xl bg-red-50 border border-red-300 text-red-800 text-xs font-medium flex items-center gap-2 rise-in">
                <Icon name="alert" className="w-4 h-4 text-red-600 flex-shrink-0" />
                <span>Wrong password. Please try again.</span>
              </div>
            )}

            {errorState && errorState.type === "VALIDATION" && (
              <div className="p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center gap-2">
                <Icon name="alert" className="w-4 h-4 flex-shrink-0" />
                <span>{errorState.message}</span>
              </div>
            )}

            <div>
              <label className="text-xs font-semibold text-ink/80 block mb-1">Email or Phone</label>
              <input
                type="text"
                placeholder="Enter email or phone"
                value={formData.email}
                onChange={(e) => handleIdentifierChange(e.target.value)}
                className={`w-full px-3.5 py-2.5 rounded-xl bg-white border text-sm outline-none transition-all ${
                  errorState && errorState.type === "NOT_FOUND"
                    ? "border-amber-400 ring-2 ring-amber-100"
                    : "border-line focus:border-gold"
                }`}
              />
            </div>

            <div>
              <label className="text-xs font-semibold text-ink/80 block mb-1">Password</label>
              <div className="relative">
                <input
                  type={showPassword ? "text" : "password"}
                  placeholder="Enter password"
                  value={formData.password}
                  onChange={(e) => handlePasswordChange(e.target.value)}
                  className={`w-full px-3.5 py-2.5 pr-10 rounded-xl bg-white border text-sm outline-none transition-all ${
                    errorState && errorState.type === "WRONG_PASSWORD"
                      ? "border-red-500 ring-2 ring-red-100"
                      : "border-line focus:border-gold"
                  }`}
                />
                <button
                  type="button"
                  onClick={() => setShowPassword(!showPassword)}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink/40 hover:text-ink transition-colors p-1"
                  title={showPassword ? "Hide password" : "Show password"}
                >
                  <Icon name={showPassword ? "eyeOff" : "eye"} className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex items-center gap-2 pt-1">
              <button
                type="button"
                onClick={onClose}
                className="w-1/3 py-2.5 rounded-xl border border-line hover:border-ink/40 text-ink/70 hover:text-ink font-medium text-sm transition-colors text-center"
              >
                Cancel
              </button>
              <button
                type="submit"
                disabled={loading}
                className="flex-1 py-2.5 rounded-xl bg-ink text-paper font-semibold text-sm hover:bg-black transition-colors flex items-center justify-center gap-2 disabled:opacity-60 shadow-sm"
              >
                {loading ? (
                  <>
                    <Icon name="spinner" className="w-4 h-4 spin-slow" />
                    <span>Signing In...</span>
                  </>
                ) : (
                  <span>Sign In</span>
                )}
              </button>
            </div>

            <div className="text-center pt-0.5 text-xs text-ink/50">
              No account yet?{" "}
              <button
                type="button"
                onClick={() => handleSwitchToSignUp(formData.email)}
                className="text-gold font-bold hover:underline"
              >
                Create Account
              </button>
            </div>
          </form>
        )}

        {/* CREATE ACCOUNT TAB */}
        {tab === "signup" && (
          <form onSubmit={handleSubmit} className="p-5 space-y-3.5">
            {errorState && errorState.type === "ALREADY_EXISTS" && (
              <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-950 text-xs rise-in">
                <div className="flex items-center justify-between gap-2">
                  <span>Account already exists.</span>
                  <button
                    type="button"
                    onClick={() => handleSwitchToSignIn(formData.email)}
                    className="font-bold text-gold hover:underline underline-offset-2 flex-shrink-0"
                  >
                    Sign In instead
                  </button>
                </div>
              </div>
            )}

            {errorState && errorState.type === "VALIDATION" && (
              <div className="p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center gap-2">
                <Icon name="alert" className="w-4 h-4 flex-shrink-0" />
                <span>{errorState.message}</span>
              </div>
            )}

            <div>
              <label className="text-xs font-semibold text-ink/80 block mb-1">Full Name</label>
              <input
                type="text"
                placeholder="e.g. John Doe"
                value={formData.name}
                onChange={(e) => setFormData(prev => ({ ...prev, name: e.target.value }))}
                className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-line text-sm outline-none focus:border-gold"
              />
            </div>

            <div>
              <label className="text-xs font-semibold text-ink/80 block mb-1">Email or Phone</label>
              <input
                type="text"
                placeholder="Enter email or phone"
                value={formData.email}
                onChange={(e) => handleIdentifierChange(e.target.value)}
                className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-line text-sm outline-none focus:border-gold"
              />
            </div>

            <div>
              <label className="text-xs font-semibold text-ink/80 block mb-1">Create Password</label>
              <div className="relative">
                <input
                  type={showPassword ? "text" : "password"}
                  placeholder="At least 6 characters"
                  value={formData.password}
                  onChange={(e) => setFormData(prev => ({ ...prev, password: e.target.value }))}
                  className="w-full px-3.5 py-2.5 pr-10 rounded-xl bg-white border border-line text-sm outline-none focus:border-gold"
                />
                <button
                  type="button"
                  onClick={() => setShowPassword(!showPassword)}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink/40 hover:text-ink transition-colors p-1"
                  title={showPassword ? "Hide password" : "Show password"}
                >
                  <Icon name={showPassword ? "eyeOff" : "eye"} className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex items-center gap-2 pt-1">

/* =========================================================
   PRODUCTS SECTION WITH LOADING SHIMMER
   ========================================================= */
const ProductsSection = ({ onView, onOrder, savedIds, onToggleSave }) => {
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState("All");
  const [activeGen, setActiveGen] = useState("All");
  const [isFiltering, setIsFiltering] = useState(false);
  const [showAll, setShowAll] = useState(false);
  const DEFAULT_LIMIT = 8;

  useEffect(() => { 
    setActiveGen("All");
    triggerFilterLoading();
  }, [activeCat]);

  const triggerFilterLoading = () => {
    setIsFiltering(true);
    setTimeout(() => setIsFiltering(false), 280);
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return PRODUCTS.filter(p => {
      const matchesCat = activeCat === "All" || p.category === activeCat;
      const matchesGen = activeCat !== "iPhones" || activeGen === "All" || p.generation === activeGen;
      const matchesQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.spec.toLowerCase().includes(q);
      return matchesCat && matchesGen && matchesQ;
    });
  }, [query, activeCat, activeGen]);

  const displayedProducts = useMemo(() => {
    if (showAll || query.trim() || activeCat !== "All" || activeGen !== "All") {
      return filtered;
    }
    return filtered.slice(0, DEFAULT_LIMIT);
  }, [filtered, showAll, query, activeCat, activeGen]);

  return (
    <section id="products" className="max-w-6xl mx-auto px-5 sm:px-8 py-16 sm:py-20">
      <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-gold mb-2">Catalog</p>
          <h2 className="font-display font-semibold text-3xl sm:text-4xl">Browse our products</h2>
        </div>
        <div className="relative w-full sm:w-72">
          <Icon name="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-ink/35" />
          <input
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
              triggerFilterLoading();
            }}
            placeholder="Search iPhone, MacBook, Watch..."
            className="w-full pl-10 pr-4 py-2.5 rounded-full bg-white border border-line text-sm outline-none focus:border-gold/60"
          />
        </div>
      </div>

      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-8">
        {["All", ...CATEGORIES].map(cat => (
          <button
            key={cat}
            onClick={() => {
              setActiveCat(cat);
              setShowAll(false);
            }}
            className={`flex-shrink-0 px-4 py-2 rounded-full text-sm border transition-colors ${
              activeCat === cat ? "bg-ink text-paper border-ink font-medium" : "bg-white text-ink/65 border-line hover:border-ink/30"
            }`}
          >
            {cat}
          </button>
        ))}
      </div>

      {activeCat === "iPhones" && (
        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2 -mt-4 mb-8">
          {["All", ...IPHONE_GENERATIONS].map(g => (
            <button
              key={g}
              onClick={() => {
                setActiveGen(g);
                triggerFilterLoading();
              }}
              className={`flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs border transition-colors ${
                activeGen === g ? "bg-gold text-white border-gold font-medium" : "bg-white text-ink/55 border-line hover:border-gold/50"
              }`}
            >
              {g === "All" ? "All Generations" : g}
            </button>
          ))}
        </div>
      )}

      <div className="flex flex-wrap items-center justify-between text-sm text-ink/55 mb-5 gap-2">
        <div className="flex items-center gap-2">
          <span className="font-medium">
            {showAll || query.trim() || activeCat !== "All" || activeGen !== "All" || filtered.length <= DEFAULT_LIMIT
              ? `Showing all ${filtered.length} ${filtered.length === 1 ? "device" : "devices"}`
              : `Showing top ${displayedProducts.length} of ${filtered.length} devices (Curated Home View)`}
          </span>
          {!query.trim() && activeCat === "All" && activeGen === "All" && filtered.length > DEFAULT_LIMIT && (
            <button
              onClick={() => setShowAll(!showAll)}
              className="text-xs text-gold hover:text-ink font-semibold underline underline-offset-2"
            >
              {showAll ? "Reduce to 8" : `Show All (${filtered.length})`}
            </button>
          )}
        </div>
        {isFiltering && (
          <div className="flex items-center gap-1.5 text-xs text-gold">
            <Icon name="spinner" className="w-3.5 h-3.5 spin-slow" />
            <span>Updating list...</span>
          </div>
        )}
      </div>

      {isFiltering ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          {[1, 2, 3, 4].map(i => (
            <div key={i} className="h-80 bg-white/60 border border-line rounded-2xl animate-pulse p-4 flex flex-col justify-between">
              <div className="bg-line/70 h-44 rounded-xl"></div>
              <div className="space-y-2">
                <div className="bg-line/70 h-4 w-3/4 rounded"></div>
                <div className="bg-line/70 h-3 w-1/2 rounded"></div>
              </div>
            </div>
          ))}
        </div>
      ) : filtered.length === 0 ? (
        <div className="py-16 text-center border border-dashed border-line rounded-2xl">
          <p className="font-display text-xl mb-1">No products match that search</p>
          <p className="text-sm text-ink/50">Try another keyword, or a different category.</p>
        </div>
      ) : (
        <>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {displayedProducts.map(p => (
              <ProductCard
                key={p.id}
                product={p}
                onView={onView}
                onOrder={onOrder}
                isSaved={savedIds.includes(p.id)}
                onToggleSave={onToggleSave}
              />
            ))}
          </div>

          {!query.trim() && activeCat === "All" && activeGen === "All" && filtered.length > DEFAULT_LIMIT && (
            <div className="mt-10 flex flex-col items-center justify-center gap-2.5">
              <button
                onClick={() => {
                  setShowAll(!showAll);
                  if (showAll) {
                    const el = document.getElementById("products");
                    if (el) el.scrollIntoView({ behavior: "smooth" });
                  }
                }}
                className="px-7 py-3.5 rounded-full bg-white border border-line hover:border-ink text-ink font-semibold text-sm transition-all shadow-sm hover:shadow-md flex items-center gap-2.5 group cursor-pointer"
              >
                <span>{showAll ? "Show Fewer Devices (Top 8 on Home)" : `Browse Full Inventory (${filtered.length} Devices)`}</span>
                <Icon name={showAll ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-gold group-hover:translate-y-0.5 transition-transform" />
              </button>
              <p className="text-xs text-ink/45">
                {showAll
                  ? `Showing full stock of ${filtered.length} devices`
                  : `Showing 8 top devices for faster home page navigation`}
              </p>
            </div>
          )}
        </>
      )}
    </section>
  );
};

          <a href={waLink(`Hi ${BUSINESS.name}, I have a question.`)} target="_blank" rel="noopener"
             className="flex items-center gap-3.5 p-4 rounded-2xl bg-white border border-line hover:border-ink/30 transition-colors">
            <span className="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0">
              <Icon name="whatsapp" className="w-5 h-5" />
            </span>
            <div>
              <p className="text-xs text-ink/45">WhatsApp</p>
              <p className="text-sm font-medium">{BUSINESS.whatsappDisplay}</p>
            </div>
          </a>

          <a href={`tel:${BUSINESS.phoneDisplay.replace(/\s/g, "")}`}
             className="flex items-center gap-3.5 p-4 rounded-2xl bg-white border border-line hover:border-ink/30 transition-colors">
            <span className="w-10 h-10 rounded-full bg-ink/5 text-ink flex items-center justify-center flex-shrink-0">
              <Icon name="phone" className="w-5 h-5" />
            </span>
            <div>
              <p className="text-xs text-ink/45">Phone</p>
              <p className="text-sm font-medium">{BUSINESS.phoneDisplay}</p>
            </div>
          </a>

          <a href={`mailto:${BUSINESS.email}`}
             className="flex items-center gap-3.5 p-4 rounded-2xl bg-white border border-line hover:border-ink/30 transition-colors">
            <span className="w-10 h-10 rounded-full bg-ink/5 text-ink flex items-center justify-center flex-shrink-0">
              <Icon name="mail" className="w-5 h-5" />
            </span>
            <div>
              <p className="text-xs text-ink/45">Email</p>
              <p className="text-sm font-medium">{BUSINESS.email}</p>
            </div>
          </a>

          <div className="flex items-center gap-3.5 p-4 rounded-2xl bg-white border border-line">
            <span className="w-10 h-10 rounded-full bg-ink/5 text-ink flex items-center justify-center flex-shrink-0">
              <Icon name="pin" className="w-5 h-5" />
            </span>
            <div>
              <p className="text-xs text-ink/45">Shop Location</p>
              <p className="text-sm font-medium">{BUSINESS.address}</p>
            </div>
          </div>

          <div className="flex items-start gap-3.5 p-4 rounded-2xl bg-white border border-line">
            <span className="w-10 h-10 rounded-full bg-ink/5 text-ink flex items-center justify-center flex-shrink-0">
              <Icon name="clock" className="w-5 h-5" />
            </span>
            <div className="text-sm">
              <p className="text-xs text-ink/45 mb-1">Opening Hours</p>
              {BUSINESS.hours.map(h => (
                <div key={h.day} className="flex justify-between gap-6 text-ink/75">
                  <span>{h.day}</span><span className="font-medium">{h.time}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        <form onSubmit={submit} className="p-6 rounded-2xl bg-white border border-line h-fit">
          <h3 className="font-display font-semibold text-lg mb-4">Send us a message</h3>
          {sent && (
            <div className="mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm flex items-center gap-2">
              <Icon name="check" className="w-4 h-4" /> Message noted — we'll get back to you shortly.
            </div>
          )}
          <div className="space-y-3">
            <input
              value={form.name}
              onChange={(e) => setForm({ ...form, name: e.target.value })}
              placeholder="Your name"
              className="w-full px-4 py-3 rounded-xl bg-paper border border-line text-sm outline-none focus:border-gold/60"
            />
            <input
              value={form.phone}
              onChange={(e) => setForm({ ...form, phone: e.target.value })}
              placeholder="Phone number"
              className="w-full px-4 py-3 rounded-xl bg-paper border border-line text-sm outline-none focus:border-gold/60"
            />
            <textarea
              value={form.message}
              onChange={(e) => setForm({ ...form, message: e.target.value })}
              placeholder="What are you looking for?"
              rows="4"
              className="w-full px-4 py-3 rounded-xl bg-paper border border-line text-sm outline-none focus:border-gold/60"
            ></textarea>
          </div>
          <button
            type="submit"
            disabled={sending}
            className="mt-4 w-full py-3.5 rounded-xl bg-ink text-paper font-semibold text-sm hover:bg-black transition-colors flex items-center justify-center gap-2"
          >
            {sending ? (
              <>
                <Icon name="spinner" className="w-4 h-4 spin-slow" />
                <span>Sending message...</span>
              </>
            ) : (
              <span>Send Message</span>

          </button>
        </form>
      </div>
    </section>
  );
};

/* =========================================================
   MAIN APP WITH LOADING SYSTEM & LOGIN SYSTEM
   ========================================================= */
function App() {
  const [initialLoading, setInitialLoading] = useState(true);
  const [loadProgress, setLoadProgress] = useState(20);
  const [loadStatus, setLoadStatus] = useState("Initializing CORE secure store...");

  const [viewProduct, setViewProduct] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  // Smart Authentication State
  const [authModalOpen, setAuthModalOpen] = useState(false);
  const [authInitialTab, setAuthInitialTab] = useState("signin");
  const [guestNoticeContext, setGuestNoticeContext] = useState(null);
  const [user, setUser] = useState(null);

  // Wishlist / Saved items
  const [savedIds, setSavedIds] = useState([]);

  // Simulate startup loading sequence
  useEffect(() => {
    // Check for existing session
    try {
      const savedUser = localStorage.getItem("core_auth_user");
      if (savedUser) setUser(JSON.parse(savedUser));
      const savedWishlist = localStorage.getItem("core_wishlist");
      if (savedWishlist) setSavedIds(JSON.parse(savedWishlist));
    } catch (e) {
      console.error(e);
    }

    const timer1 = setTimeout(() => {
      setLoadProgress(60);
      setLoadStatus("Fetching genuine iPhone & electronics inventory...");
    }, 400);

    const timer2 = setTimeout(() => {
      setLoadProgress(90);
      setLoadStatus("Verifying pricing and warranty information...");
    }, 850);

    const timer3 = setTimeout(() => {
      setLoadProgress(100);
      setLoadStatus("Ready!");
      setTimeout(() => setInitialLoading(false), 250);
    }, 1200);

    return () => {
      clearTimeout(timer1);
      clearTimeout(timer2);
      clearTimeout(timer3);
    };
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3600);
  };

  const handleOpenAuth = (tab = "signin", notice = null) => {
    setAuthInitialTab(tab);
    setGuestNoticeContext(notice);
    setAuthModalOpen(true);
  };

  const handleToggleSave = (productId) => {
    let newSaved;
    if (savedIds.includes(productId)) {
      newSaved = savedIds.filter(id => id !== productId);
      showToast("Removed from saved list");
    } else {
      newSaved = [...savedIds, productId];
      if (!user) {
        showToast("Saved to favorites! You haven't logged in yet — create an account to sync across devices.");
      } else {
        showToast("Saved to your favorites!");
      }
    }
    setSavedIds(newSaved);
    localStorage.setItem("core_wishlist", JSON.stringify(newSaved));
  };

  const handleLogout = () => {
    localStorage.removeItem("core_auth_user");
    setUser(null);
    showToast("You have been signed out. You are now browsing as a guest.");
  };

  const handleOrder = (product) => {
    window.open(
      waLink(`Hi ${BUSINESS.name}, I'd like to order the ${product.name} (${product.spec}) listed at ${money(product.price)}. My name is ${user ? user.name : "Customer"}.`),
      "_blank"
    );
    showToast(`Opening WhatsApp to order ${product.name}`);
  };

  return (
    <div>
      {initialLoading && <AppLoader progress={loadProgress} status={loadStatus} />}


      <Nav
        user={user}
        onOpenAuth={(tab) => handleOpenAuth(tab || "signin")}
        onLogout={handleLogout}
        savedCount={savedIds.length}
      />
      
      <Hero />
      
      <ProductsSection
        onView={setViewProduct}
        onOrder={handleOrder}
        savedIds={savedIds}
        onToggleSave={handleToggleSave}
      />
      
      <WhyChooseUs />
      <HowToOrder />
      <About />
      <Contact />
      <Footer />

      <ProductModal
        product={viewProduct}
        onClose={() => setViewProduct(null)}
        onOrder={handleOrder}
        isSaved={viewProduct ? savedIds.includes(viewProduct.id) : false}
        onToggleSave={handleToggleSave}
      />

      <AuthModal
        isOpen={authModalOpen}
        onClose={() => setAuthModalOpen(false)}
        onLoginSuccess={(u) => setUser(u)}
        showToast={showToast}
        initialTab={authInitialTab}
        guestNotice={guestNoticeContext}
      />

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
